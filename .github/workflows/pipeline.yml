name: CI Pipeline

on:
  pull_request: # Trigger pipeline on pull requests
    branches:
      - main
      - pseudo-main
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering of the workflow
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIRS:         "demo/fixed" # Working directories for all stages
  # Utility versions
  TFLINT_VERSION:    "v0.60.0"     # TFLint version to install
  TERRAFORM_VERSION: "1.14.8"      # Terraform version to install
  CHECKOV_VERSION:   "3.2.524"     # Checkov version to install
  TFSEC_VERSION:     "v1.28.14"    # TFSec version to install
  TRIVY_VERSION:     "0.70.0"      # Trivy version to install

  # Automatically defined variables (Don't change anything, all variables are managed by Terraform only!!)
  AWS_S3_BUCKET:     "${{ vars.ARTIFACTS_BUCKET }}"  # AWS S3 bucket to upload logs
  VCS_API_ENDPOINT:  "${{ github.api_url }}"         # VCS API base URL (consumed by the script)
  OIDC_ROLE_ARN:     "${{ vars.OIDC_ROLE_ARN }}"     # The OIDC AWS Role ARN
  JOB_TOKEN:         "${{ secrets.JOB_TOKEN }}"      # The VCS token for API calls
  VCS_PROVIDER:      "${{ vars.VCS_PROVIDER }}"      # The VCS provider
  AI_HANDLER_CREATE: "${{ vars.AI_HANDLER_CREATE }}" # Enable or disable AI Handler
  GITHUB_RUN_URL:    "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"  # The run URL for  GitHub repository

jobs:
  validate-work-dirs:
    name: Validate WORK_DIRS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate WORK_DIRS directories
        shell: bash
        run: |
          echo -e "\033[34mValidating WORK_DIRS directories...\033[0m"
          CLEANED_WORK_DIRS="$(echo "$WORK_DIRS" | tr -d '[:space:]')"
          if [[ -z "$CLEANED_WORK_DIRS" ]]; then
            echo -e "\033[31mWORK_DIRS is empty. Please define at least one existing working directory.\033[0m"
            exit 1
          fi

          IFS=',' read -r -a DIRS <<< "$CLEANED_WORK_DIRS"
          VALID_DIR_COUNT=0
          MISSING_DIRS=()

          for dir in "${DIRS[@]}"; do
            [[ -z "$dir" ]] && continue
            VALID_DIR_COUNT=$((VALID_DIR_COUNT + 1))
            if [[ -d "$dir" ]]; then
              echo -e "\033[32mDirectory exists: $dir\033[0m"
            else
              echo -e "\033[31mDirectory does not exist: $dir\033[0m"
              MISSING_DIRS+=("$dir")
            fi
          done

          if [[ $VALID_DIR_COUNT -eq 0 ]]; then
            echo -e "\033[31mWORK_DIRS does not contain valid directory entries.\033[0m"
            exit 1
          fi

          if [[ ${#MISSING_DIRS[@]} -gt 0 ]]; then
            echo -e "\033[31mOne or more directories from WORK_DIRS do not exist. Failing the pipeline.\033[0m"
            printf 'Missing directories:\n - %s\n' "${MISSING_DIRS[@]}"
            exit 1
          fi

          echo -e "\033[32mAll directories from WORK_DIRS exist.\033[0m"

      # Store the validated configuration for the matching PR revision.
      - name: Save WORK_DIRS artifact
        if: github.event_name == 'pull_request'
        shell: bash
        run: printf '%s\n' "$WORK_DIRS" > "$RUNNER_TEMP/work-dirs.txt"

      - name: Upload WORK_DIRS artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-work-dirs-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/work-dirs.txt
          if-no-files-found: error
          retention-days: 7

  setup:
    name: Setup Tools
    runs-on: ubuntu-latest
    needs:
      - validate-work-dirs
    outputs:
      source-sha: ${{ steps.get-sha.outputs.source_sha }} # Output variable for the next job
      # Re-exported so jobs calling run-scanner.yml can read them: a job's `with:`
      # block only sees needs/vars/github/secrets context, not this workflow's
      # own top-level `env:` -- `env.*` isn't resolvable there.
      work-dirs: ${{ steps.export-config.outputs.work_dirs }}
      cache-key: ${{ steps.export-config.outputs.cache_key }}
      terraform-version: ${{ steps.export-config.outputs.terraform_version }}
      tflint-version: ${{ steps.export-config.outputs.tflint_version }}
      trivy-version: ${{ steps.export-config.outputs.trivy_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify preinstalled tools (AWS CLI, jq)
        run: |
          echo -n "AWS CLI Version: "; aws --version || { echo "AWS CLI not found on the runner image"; exit 1; }
          jq --version || { echo "jq not found on the runner image"; exit 1; }

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: &tools-cache
          path: ~/.local
          key: tools-cache-v5-${{ env.CHECKOV_VERSION }}-${{ env.TFSEC_VERSION }}

      - name: Detect cached tools
        id: tools-check
        run: |
          echo -e "\033[34mChecking if tools are already cached...\033[0m"
          LOCAL_BIN="$HOME/.local/bin"
          mkdir -p "$LOCAL_BIN"
          if [ -x "$LOCAL_BIN/checkov" ] && [ -x "$LOCAL_BIN/tfsec" ]; then
            echo -e "\033[32mTools are already cached. Skipping installation.\033[0m"
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

      # pip and curl write to different things (Python packages vs. a single
      # binary), so these two installs don't depend on each other and run
      # concurrently (EPMCACMAWS-497).
      - parallel:
          - name: Install Checkov
            if: steps.tools-check.outputs.cached != 'true'
            run: |
              pip install --upgrade pip
              echo -e "\033[34mInstalling Checkov...\033[0m"
              pip install -q --user checkov==${CHECKOV_VERSION}
              echo -e "\033[32mCheckov installed successfully.\033[0m"

          - name: Install TFsec
            if: steps.tools-check.outputs.cached != 'true'
            run: |
              LOCAL_BIN="$HOME/.local/bin"
              echo -e "\033[34mInstalling TFsec...\033[0m"
              curl -L https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64 -o "$LOCAL_BIN/tfsec"
              chmod +x "$LOCAL_BIN/tfsec"
              echo -e "\033[32mTFsec installed successfully.\033[0m"

      - name: Verify installed tools
        id: setup-status
        run: |
          echo -e "\033[34mVerifying installed tools:\033[0m"
          echo -n "Checkov Version: "; checkov --version || { echo "Checkov installation failed"; exit 1; }
          echo -n "TFsec Version: "; tfsec --version || { echo "TFsec installation failed"; exit 1; }

      - name: Get Source Commit SHA
        id: get-sha
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "source_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "source_sha=$GITHUB_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Export shared config for run-scanner.yml callers
        id: export-config
        shell: bash
        run: |
          echo "work_dirs=$WORK_DIRS" >> "$GITHUB_OUTPUT"
          # Cache key built here, once -- run-scanner.yml just takes the
          # finished string, so the format only needs to match the "setup"
          # job's own Restore Tools Cache step in one place, not two.
          echo "cache_key=tools-cache-v5-${CHECKOV_VERSION}-${TFSEC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "terraform_version=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"
          echo "tflint_version=$TFLINT_VERSION" >> "$GITHUB_OUTPUT"
          echo "trivy_version=$TRIVY_VERSION" >> "$GITHUB_OUTPUT"

  tflint-analysis:
    name: TFLint Analysis
    needs:
      - setup
    if: ${{ contains(vars.RUN_TFLINT_ANALYSIS, 'true') }}
    uses: ./.github/workflows/run-scanner.yml
    with:
      tool-name: TFLint
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      scanner-command: 'tflint --chdir="$dir"'
      pre-command: 'tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"'
      source-sha: ${{ needs.setup.outputs.source-sha }}
      cache-key: ${{ needs.setup.outputs.cache-key }}
      tflint-version: ${{ needs.setup.outputs.tflint-version }}
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}

  terraform-validate:
    name: Terraform Validate
    needs:
      - setup
      - tflint-analysis
    if: ${{ !cancelled() && contains(vars.RUN_TERRAFORM_VALIDATE, 'true') && needs.tflint-analysis.result != 'failure' }}
    uses: ./.github/workflows/run-terraform.yml
    with:
      terraform-command: validate
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      source-sha: ${{ needs.setup.outputs.source-sha }}
      terraform-version: ${{ needs.setup.outputs.terraform-version }}
      use-backend: false
      first-dir-only: false
      post-comment: true
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}
  checkov-analysis:
    name: Checkov Analysis
    needs:
      - setup
      - tflint-analysis
      - terraform-validate
    if: ${{ !cancelled() && contains(vars.RUN_CHECKOV_ANALYSIS, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' }}
    uses: ./.github/workflows/run-scanner.yml
    with:
      tool-name: Checkov
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      scanner-command: 'checkov -d "$dir" --config-file "$GITHUB_WORKSPACE/.checkov.yaml" --quiet --framework terraform --download-external-modules false'
      source-sha: ${{ needs.setup.outputs.source-sha }}
      cache-key: ${{ needs.setup.outputs.cache-key }}
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}
  tfsec-analysis:
    name: TFsec Analysis
    needs:
      - setup
      - tflint-analysis
      - terraform-validate
      - checkov-analysis
    if: ${{ !cancelled() && contains(vars.RUN_TFSEC_ANALYSIS, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' && needs.checkov-analysis.result != 'failure' }}
    uses: ./.github/workflows/run-scanner.yml
    with:
      tool-name: TFSec
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      scanner-command: 'tfsec "$dir" --no-module-downloads'
      source-sha: ${{ needs.setup.outputs.source-sha }}
      cache-key: ${{ needs.setup.outputs.cache-key }}
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}
  trivy-analysis:
    name: Trivy Analysis
    needs:
      - setup
      - tflint-analysis
      - terraform-validate
      - checkov-analysis
      - tfsec-analysis
    if: ${{ !cancelled() && contains(vars.RUN_TRIVY_ANALYSIS, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' && needs.checkov-analysis.result != 'failure' && needs.tfsec-analysis.result != 'failure' }}
    uses: ./.github/workflows/run-scanner.yml
    with:
      tool-name: Trivy
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      scanner-command: 'trivy config "$dir" --exit-code 1 --severity HIGH,CRITICAL --format table'
      source-sha: ${{ needs.setup.outputs.source-sha }}
      cache-key: ${{ needs.setup.outputs.cache-key }}
      trivy-version: ${{ needs.setup.outputs.trivy-version }}
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    needs:
      - setup
      - tflint-analysis
      - terraform-validate
      - checkov-analysis
      - tfsec-analysis
      - trivy-analysis
    if: ${{ !cancelled() && !failure() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Run the reporting helper from trusted main, not from PR-modifiable code.
      - name: Checkout shared reporting utility
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
          path: .trusted-reporting
          persist-credentials: false
          sparse-checkout: scripts/upload_and_comment.sh
          sparse-checkout-cone-mode: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        id: fmt
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a dirs <<< "${WORK_DIRS//[[:space:]]/}"
          formatting_required=false
          formatting_error=false
          log_file="$GITHUB_WORKSPACE/terraform_fmt_check.log"
          : > "$log_file"

          for dir in "${dirs[@]}"; do
            [[ -z "$dir" ]] && continue
            printf '\nChecking formatting in %s\n' "$dir" | tee -a "$log_file"
            status=0
            terraform fmt -check -recursive -diff "$dir" 2>&1 | tee -a "$log_file" || status=${PIPESTATUS[0]}
            if [[ $status -eq 3 ]]; then
              formatting_required=true
            elif [[ $status -ne 0 ]]; then
              formatting_error=true
              echo "::error::terraform fmt failed with exit code $status in $dir; inspect formatter output."
            fi
          done

          echo "formatting_required=$formatting_required" >> "$GITHUB_OUTPUT"
          echo "formatting_error=$formatting_error" >> "$GITHUB_OUTPUT"

      - name: Post Terraform formatting report
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          FORMAT_REQUIRED: ${{ steps.fmt.outputs.formatting_required }}
          FORMAT_ERROR: ${{ steps.fmt.outputs.formatting_error }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          VCS_API_ENDPOINT: ${{ github.api_url }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          log_file="$GITHUB_WORKSPACE/terraform_fmt_check.log"
          report="$RUNNER_TEMP/terraform_fmt_message.txt"

          if [[ "$FORMAT_ERROR" == "true" ]]; then
            echo "Terraform formatting could not complete. Correct the syntax/formatter errors manually; bot format approve cannot repair invalid HCL."
          elif [[ "$FORMAT_REQUIRED" == "true" ]]; then
            echo 'Terraform formatting is required. To apply it automatically, comment: bot format approve'
          else
            echo "Terraform formatting passed. No corrections needed."
          fi > "$report"
          cat "$log_file" >> "$report"

          bash "$GITHUB_WORKSPACE/.trusted-reporting/scripts/upload_and_comment.sh" \
            github post "$log_file" terraform_fmt_check.log "" \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_OWNER" "$GITHUB_HEAD_REF" \
            "$SOURCE_SHA" "$JOB_TOKEN" "$GITHUB_REF" "$GITHUB_RUN_ID" \
            "$PR_NUMBER" "" "Terraform Format Check" "$report" "$GITHUB_RUN_URL"

      - name: Fail on Terraform formatting issues
        if: steps.fmt.outputs.formatting_required == 'true' || steps.fmt.outputs.formatting_error == 'true'
        run: |
          echo '::error::Terraform formatting check failed. See the formatter output above.'
          exit 1

  terraform-plan:
    name: Terraform Plan
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
      - terraform-validate
      - checkov-analysis
      - tfsec-analysis
      - trivy-analysis
    if: ${{ !cancelled() && !failure() && contains(vars.RUN_TERRAFORM_PLAN, 'true') }}
    uses: ./.github/workflows/run-terraform.yml
    with:
      terraform-command: plan
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      source-sha: ${{ needs.setup.outputs.source-sha }}
      terraform-version: ${{ needs.setup.outputs.terraform-version }}
      use-backend: true
      first-dir-only: true
      post-comment: true
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}
  terraform-apply:
    name: Terraform Apply
    needs:
      - setup
      - terraform-plan
    if: ${{ !cancelled() && contains(vars.RUN_TERRAFORM_APPLY, 'true') && needs.terraform-plan.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/run-terraform.yml
    with:
      terraform-command: apply
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      source-sha: ${{ needs.setup.outputs.source-sha }}
      terraform-version: ${{ needs.setup.outputs.terraform-version }}
      use-backend: true
      first-dir-only: true
      post-comment: false
      deploy-environment: terraform-apply
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}
