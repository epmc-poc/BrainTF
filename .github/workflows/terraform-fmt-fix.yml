name: Terraform Format Auto-Fix

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to format (test mode)'
        required: true
        type: number

permissions:
  actions: read

jobs:
  terraform-fmt-fix:
    name: Apply approved Terraform formatting
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == 'bot format approve')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve eligible pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.JOB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
        run: |
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRefOid \
            --jq '"branch=\(.headRefName)\nsha=\(.headRefOid)"' >> "$GITHUB_OUTPUT"
          
          echo "$GITHUB_OUTPUT"

      - name: Checkout exact PR commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          token: ${{ secrets.JOB_TOKEN }}

