name: Tmp Hyphen Test

on:
  workflow_dispatch:
    inputs:
      test-value:
        description: "test"
        required: false
        type: string
        default: "hello"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: dot notation with hyphen (bare if)
        if: inputs.test-value != ''
        run: echo "DOT NOTATION IF PASSED, value=${{ inputs.test-value }}"

      - name: dot notation with hyphen (always run, print value)
        if: always()
        run: echo "value via dot = ${{ inputs.test-value }}"

      - name: bracket notation (control)
        if: inputs['test-value'] != ''
        run: echo "BRACKET NOTATION IF PASSED, value=${{ inputs['test-value'] }}"
