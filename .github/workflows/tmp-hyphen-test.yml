name: Tmp Hyphen Test

on:
  push:
    branches:
      - EPMCACMAWS-464-Kotova-scanner-reusable-workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: dot notation with hyphen (bare if)
        if: inputs.test-value != ''
        run: echo "DOT NOTATION IF PASSED"

      - name: always print
        if: always()
        run: echo "job reached this step"

      - name: bracket notation (control)
        if: vars.AWS_REGION != ''
        run: echo "BRACKET-STYLE CONTROL STEP RAN"
