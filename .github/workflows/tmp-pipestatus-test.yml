name: Tmp Pipestatus Test

on:
  push:
    branches:
      - EPMCACMAWS-464-Kotova-scanner-reusable-workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: PIPESTATUS index test (mirrors run-scanner.yml pattern)
        shell: bash
        run: |
          echo "=== Test 1: false | true ==="
          false | true
          echo "PIPESTATUS[0] (first cmd, false)  = ${PIPESTATUS[0]}"
          echo "PIPESTATUS[1] (last cmd, true)     = ${PIPESTATUS[1]}"

          echo "=== Test 2: exact pattern from run-scanner.yml ==="
          SCANNER_COMMAND='exit 7'
          CURRENT_EXIT_CODE=0
          eval "$SCANNER_COMMAND" 2>&1 | tee /tmp/result.txt || CURRENT_EXIT_CODE=${PIPESTATUS[0]}
          echo "SCANNER_COMMAND was 'exit 7', tee always succeeds (exit 0)"
          echo "CURRENT_EXIT_CODE captured = $CURRENT_EXIT_CODE  (expect 7, the scanner's own code, not tee's 0)"
