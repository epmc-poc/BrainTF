name: Create BrainTF Instance

# Self-service "factory" that provisions a new per-developer BrainTF instance repository
# from this template repo. Run manually from the Actions tab (Run workflow) and enter an
# instance_id. The AWS resources are NOT created here — after the repo is created, deploy
# from the new repo following docs/installation.md (terraform/shared is applied once per
# account, then bootstrap and main_module with this instance_id).
#
# NOTE: workflow_dispatch only becomes available once this file is on the DEFAULT branch
#   (GitHub rule). Use the dry_run input to validate and preview without side effects.
#
# Requirements for real (non-dry-run) execution (configured once, on epmc-poc/BrainTF):
#   - A GitHub App installed on the epmc-poc org with:
#       * Repository administration: Read & write  (to create repositories)
#       * Contents: Read & write                   (to commit the rendered terraform.auto.tfvars)
#       * Variables: Read & write                  (to set the INSTANCE_ID repo variable)
#   - Secrets on this repo:
#       * FACTORY_APP_ID          — the GitHub App's App ID
#       * FACTORY_APP_PRIVATE_KEY — the GitHub App's private key (PEM)
#   - This repository (epmc-poc/BrainTF) must be marked as a template repository
#     (Settings -> Template repository).
#   - Inputs aws_account_id / aws_region pick the AWS account and region rendered
#     into the instance's backend.tf — extend the dropdown options when new
#     accounts/regions are onboarded.

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Instance id — lowercase, 1-30 chars, e.g. 'vasjr'. Namespaces all AWS resources for this instance."
        required: true
        type: string
      owner_mail:
        description: "Owner e-mail written to terraform.auto.tfvars (OwnerEmail tag), e.g. name@epam.com."
        required: true
        type: string
      aws_account_id:
        description: "AWS account where the instance will be deployed. Add more accounts as options when needed."
        required: true
        type: choice
        default: "123408385862"
        options:
          - "123408385862"
      aws_region:
        description: "AWS region for instance resources and state. Add more regions as options when needed."
        required: true
        type: choice
        default: "eu-central-1"
        options:
          - "eu-central-1"
      operation:
        description: "create — provision the instance repo; destroy — permanently delete it"
        type: choice
        default: create
        options:
          - create
          - destroy
      dry_run:
        description: "Validate and print the plan without creating or deleting anything."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create-instance:
    name: Create instance repository
    runs-on: ubuntu-latest
    # Only runs in the designated factory repo; skipped in instance repos that inherit this
    # workflow. Defaults point at epmc-poc/BrainTF; a sandbox/testing clone can override
    # via repository variables FACTORY_SOURCE_REPO / FACTORY_TARGET_OWNER.
    if: github.repository == (vars.FACTORY_SOURCE_REPO || 'epmc-poc/BrainTF')
    env:
      INSTANCE_ID: ${{ inputs.instance_id }}
      OPERATION: ${{ inputs.operation }}
      DRY_RUN: ${{ inputs.dry_run }}
      TEMPLATE_REPO: ${{ github.repository }}
      TARGET_OWNER: ${{ vars.FACTORY_TARGET_OWNER || 'epmc-poc' }}
    steps:
      - name: Validate instance_id
        run: |
          if [[ ! "${INSTANCE_ID}" =~ ^[a-z0-9]([a-z0-9-]{0,28}[a-z0-9])?$ ]]; then
            echo "::error::instance_id must be lowercase alphanumeric with hyphens, 1-30 chars, and may not start or end with a hyphen."
            exit 1
          fi
          echo "instance_id '${INSTANCE_ID}' is valid. DRY_RUN=${DRY_RUN}"

      - name: Generate GitHub App token
        id: app-token
        if: env.DRY_RUN != 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ env.TARGET_OWNER }}

      - name: Create repository from template
        if: env.DRY_RUN != 'true' && env.OPERATION == 'create'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="braintf-${INSTANCE_ID}"
          FULL="${TARGET_OWNER}/${REPO}"
          # The set of existing braintf-* repositories is the instance registry: fail fast on duplicates.
          if gh repo view "${FULL}" >/dev/null 2>&1; then
            echo "::error::Repository ${FULL} already exists. Pick a unique instance_id."
            exit 1
          fi
          echo "Creating ${FULL} from template ${TEMPLATE_REPO}..."
          # REST endpoint (not gh repo create, which uses GraphQL cloneTemplateRepository):
          # POST /repos/{template}/generate is officially supported for GitHub App
          # installation tokens with Administration: write.
          gh api -X POST "repos/${TEMPLATE_REPO}/generate" \
            -f owner="${TARGET_OWNER}" \
            -f name="${REPO}" \
            -F private=true \
            --jq '"Created: \(.full_name)"'

      - name: Set INSTANCE_ID repository variable
        if: env.DRY_RUN != 'true' && env.OPERATION == 'create'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh variable set INSTANCE_ID \
            --repo "${TARGET_OWNER}/braintf-${INSTANCE_ID}" \
            --body "${INSTANCE_ID}"

      - name: Render and commit terraform.auto.tfvars
        if: env.DRY_RUN != 'true' && env.OPERATION == 'create'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VCS_PROJECT_PATH: ${{ env.TARGET_OWNER }}/braintf-${{ inputs.instance_id }}
          VCS_REPO_NAME: braintf-${{ inputs.instance_id }}
          OWNER_MAIL: ${{ inputs.owner_mail }}
          # No AWS creds here — account/region for backend.tf come from the
          # workflow_dispatch inputs (dropdowns above).
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          REPO="${TARGET_OWNER}/braintf-${INSTANCE_ID}"
          # Template generation (repos/.../generate) is asynchronous: the repo
          # exists immediately but its content is copied a few seconds later, so
          # an immediate clone yields an empty repo. Poll until the default
          # branch has the rendering script before cloning.
          for i in $(seq 1 30); do
            if gh api "repos/${REPO}/contents/scripts/render_tfvars.sh" >/dev/null 2>&1; then
              echo "Template content is ready (attempt ${i})."
              break
            fi
            if [[ "${i}" == "30" ]]; then
              echo "::error::Template content for ${REPO} not populated after 30 attempts."
              exit 1
            fi
            echo "Waiting for template content to populate (attempt ${i})..."
            sleep 5
          done
          gh repo clone "${REPO}" instance-repo
          cd instance-repo
          bash ./scripts/render_tfvars.sh
          SLUG="${{ steps.app-token.outputs.app-slug }}"; SLUG="${SLUG:-braintf-factory}"
          git config user.name "${SLUG}[bot]"
          git config user.email "${{ secrets.FACTORY_APP_ID }}+${SLUG}[bot]@users.noreply.github.com"
          # *.auto.tfvars is gitignored in the template, but each instance repo
          # must carry its own rendered copy — force-add it.
          git add -f terraform/main_module/terraform.auto.tfvars terraform/main_module/backend.tf
          git diff --cached --quiet || git commit -m "chore: render terraform.auto.tfvars for instance ${INSTANCE_ID}"
          # gh clones with a plain https remote; plain `git push` has no creds
          # (GH_TOKEN is only visible to gh, not git). Push via a token URL.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main

      - name: Destroy instance repository
        if: env.DRY_RUN != 'true' && env.OPERATION == 'destroy'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="braintf-${INSTANCE_ID}"
          FULL="${TARGET_OWNER}/${REPO}"
          # Only repositories under the managed braintf-* naming scheme may be deleted.
          case "${REPO}" in
            braintf-*) ;;
            *) echo "::error::Refusing to delete '${FULL}': outside the braintf-* scheme."; exit 1 ;;
          esac
          if ! gh repo view "${FULL}" >/dev/null 2>&1; then
            echo "::error::Repository ${FULL} does not exist."
            exit 1
          fi
          echo "Deleting ${FULL}..."
          gh api -X DELETE "repos/${FULL}"
          echo "Deleted ${FULL}. This does NOT remove AWS resources — destroy those from the instance repo first."

      - name: Dry-run plan
        if: env.DRY_RUN == 'true'
        run: |
          echo "DRY RUN — no changes made."
          if [[ "${OPERATION}" == "destroy" ]]; then
            echo "Would DELETE repository: ${TARGET_OWNER}/braintf-${INSTANCE_ID}"
          else
            echo "Would create repository: ${TARGET_OWNER}/braintf-${INSTANCE_ID} from template ${TEMPLATE_REPO}"
            echo "Would set repository variable INSTANCE_ID=${INSTANCE_ID}"
            echo "Would render and commit terraform.auto.tfvars (instance_id=${INSTANCE_ID}, owner_mail=${{ inputs.owner_mail }})"
            echo "Would render and commit backend.tf (account=${{ inputs.aws_account_id }}, region=${{ inputs.aws_region }})"
          fi

      - name: Summary
        run: |
          {
            echo "### BrainTF instance factory"
            echo ""
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "**Dry run** — no changes were made."
            fi
            echo "- Operation: \`${OPERATION}\`"
            echo "- Target repository: \`${TARGET_OWNER}/braintf-${INSTANCE_ID}\`"
            echo "- Instance id: \`${INSTANCE_ID}\`"
            echo ""
            echo "For a real run: use **Run workflow** (workflow_dispatch) from the default branch with dry_run unchecked."
          } >> "$GITHUB_STEP_SUMMARY"
