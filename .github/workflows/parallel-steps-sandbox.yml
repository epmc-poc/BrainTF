# Isolated sandbox for EPMCACMAWS-497.
# Manual-only: does not run on pull_request/push and does not touch the production pipeline.
#
# How to run: Actions → Parallel steps sandbox → Run workflow
#
# Working syntax (GitHub docs, 2026-06-25):
#   parallel:          group of independent steps, implicit wait at the end
#   background: true   start a step and continue; later wait / wait-all / cancel
#   wait: id | [ids]   block until named background steps finish
#   wait-all:          block until every active background step finishes
#
# `parallel:` is a step-list item, not a job key. Putting it under `jobs.<id>` is invalid YAML/schema
# and is why the EPMCACMAWS-463 sandbox failed with "Invalid workflow file".

name: Parallel steps sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-parallel:
    name: parallel keyword
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - parallel:
          - name: Worker A
            run: |
              echo "A started $(date -u +%H:%M:%S)"
              sleep 5
              echo "A finished $(date -u +%H:%M:%S)"
          - name: Worker B
            run: |
              echo "B started $(date -u +%H:%M:%S)"
              sleep 5
              echo "B finished $(date -u +%H:%M:%S)"

      - name: After implicit wait
        run: echo "Both workers finished. Wall-clock should be ~5s, not ~10s."

  syntax-background:
    name: background + wait
    runs-on: ubuntu-latest
    steps:
      - name: Background worker
        id: bg-worker
        run: |
          echo "background started"
          sleep 3
          echo "result=ok" >> "$GITHUB_OUTPUT"
        background: true

      - name: Foreground work while background runs
        run: echo "This step starts immediately, without waiting for bg-worker."

      - name: Wait for background worker
        wait: bg-worker

      - name: Read deferred output
        run: echo "bg-worker result=${{ steps.bg-worker.outputs.result }}"

  last-writer-wins:
    name: Parallel writers race (why analysis stays sequential)
    runs-on: ubuntu-latest
    steps:
      - name: Shared target
        run: echo "original" > /tmp/proposed-fix.tf

      - parallel:
          - name: Fake TFLint AI fix
            run: |
              sleep 1
              echo "# tflint: rename variable" > /tmp/proposed-fix.tf
          - name: Fake Checkov AI fix
            run: |
              sleep 2
              echo "# checkov: add public access block" > /tmp/proposed-fix.tf

      - name: Show surviving fix
        run: |
          echo "Last writer won. Surviving content:"
          cat /tmp/proposed-fix.tf
          echo
          echo "This is the same race as two analysis jobs posting AI fixes to artifacts/{PR}/."
          echo "AI Handler deletes that prefix before upload, so parallel linters are not safe."
