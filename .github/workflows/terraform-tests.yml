name: Terraform Tests

# Tests BrainTF's own Terraform code (terraform/**); pipeline.yml keeps scanning WORK_DIRS. See docs/terraform_testing.md.
# Unit tests run on every PR without credentials or network. Integration tests create real resources in the test
# account and run only on request (label tf-integration); they are skipped where TF_TEST_ROLE_ARN is unset.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths:
      - terraform/**
      - .github/workflows/terraform-tests.yml
  workflow_dispatch:
    inputs:
      integration:
        description: "Also run the integration tests (creates and deletes resources in the test AWS account)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.14.8" # Keep in sync with pipeline.yml and DEPENDENCIES.md
  TF_IN_AUTOMATION: "true"
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  discover:
    name: Find test suites
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.find.outputs.unit }}
      integration: ${{ steps.find.outputs.integration }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: List configurations with tests
        id: find
        run: |
          for kind in unit integration; do
            dirs=$(find terraform -path "*/tests/$kind/*.tftest.hcl" -not -path '*/.terraform/*' \
              | sed "s|/tests/$kind/.*||" | sort -u | jq -R . | jq -cs .)
            echo "$kind=$dirs" >> "$GITHUB_OUTPUT"
            echo "Configurations with $kind tests: $dirs"
          done

  unit:
    name: Unit · ${{ matrix.dir }}
    needs: discover
    if: needs.discover.outputs.unit != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.unit) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Prepare provider cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Restore providers and modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ matrix.dir }}/.terraform/modules
          key: tf-${{ env.TERRAFORM_VERSION }}-${{ matrix.dir }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: tf-${{ env.TERRAFORM_VERSION }}-${{ matrix.dir }}-

      - name: Terraform fmt (configuration and tests)
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        run: terraform init -backend=false -input=false -test-directory=tests/unit

      - name: Terraform validate (configuration and tests)
        run: terraform validate -test-directory=tests/unit

      - name: Terraform test (no credentials, no network)
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_EC2_METADATA_DISABLED: "true"
          REPORT: ${{ github.workspace }}/junit-unit-${{ strategy.job-index }}.xml
        run: |
          # No network: an unmocked provider or a provisioner fails the test instead of reaching out.
          # Ubuntu 24.04 blocks unprivileged user namespaces, hence sudo; setpriv drops back to the runner user.
          tf="$(command -v terraform)"
          if unshare -rn true 2>/dev/null; then
            unshare -rn "$tf" test -test-directory=tests/unit -junit-xml="$REPORT"
          else
            sudo -E unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
              "$tf" test -test-directory=tests/unit -junit-xml="$REPORT"
          fi

      # terraform test writes no suite durations and hides some error reasons; the script fills both in.
      - name: Normalize JUnit report
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: python3 scripts/normalize_terraform_junit.py "junit-unit-${{ strategy.job-index }}.xml"

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit-${{ strategy.job-index }}
          path: junit-unit-${{ strategy.job-index }}.xml
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  integration:
    name: Integration · ${{ matrix.dir }}
    needs:
      - discover
      - unit
    # !cancelled(): the finding_* runs fail the unit jobs on purpose, which must not skip this stage.
    if: >-
      !cancelled() && needs.discover.outputs.integration != '[]' && vars.TF_TEST_ROLE_ARN != '' && (
        (github.event_name == 'workflow_dispatch' && inputs.integration) ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         contains(github.event.pull_request.labels.*.name, 'tf-integration'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for the AWS role
    # Never cancel: an interrupted apply leaves resources behind.
    concurrency:
      group: terraform-integration-${{ github.ref }}-${{ matrix.dir }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.integration) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      TF_VAR_run_id: ${{ github.run_id }}-${{ strategy.job-index }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Assume the test role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_TEST_ROLE_ARN }}
          role-session-name: terraform-test-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ vars.TF_TEST_AWS_REGION }}

      - name: Prepare provider cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Restore providers and modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ matrix.dir }}/.terraform/modules
          key: tf-${{ env.TERRAFORM_VERSION }}-${{ matrix.dir }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: tf-${{ env.TERRAFORM_VERSION }}-${{ matrix.dir }}-

      - name: Terraform init
        run: terraform init -backend=false -input=false -test-directory=tests/integration

      - name: Terraform validate (configuration and tests)
        run: terraform validate -test-directory=tests/integration

      - name: Terraform test (creates and destroys real resources)
        run: terraform test -test-directory=tests/integration -junit-xml="$GITHUB_WORKSPACE/junit-integration-${{ strategy.job-index }}.xml"

      - name: Normalize JUnit report
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: python3 scripts/normalize_terraform_junit.py "junit-integration-${{ strategy.job-index }}.xml"

      # A bucket left with this job's prefix means a failed teardown or a cancelled job.
      - name: Check for leftover test resources
        if: always()
        run: |
          prefix="braintf-tftest-${TF_VAR_run_id}-"
          left="$(aws s3api list-buckets --prefix "$prefix" --query 'Buckets[].Name' --output text)"
          if [[ -n "$left" && "$left" != "None" ]]; then
            echo "::error::Leftover test buckets: $left"
            exit 1
          fi
          echo "No leftover buckets with prefix $prefix."

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-${{ strategy.job-index }}
          path: junit-integration-${{ strategy.job-index }}.xml
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  report:
    name: Publish test report
    needs:
      - unit
      - integration
    if: ${{ !cancelled() && needs.unit.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download JUnit reports
        uses: actions/download-artifact@v7
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true

      - name: Publish test results
        uses: dorny/test-reporter@v3
        with:
          name: Terraform test results
          path: junit/*.xml
          reporter: java-junit
          fail-on-error: false
